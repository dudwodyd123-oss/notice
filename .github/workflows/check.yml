name: 공지 확인

on:
  schedule:
    # 30분마다 요청하지만 실제로는 그보다 뜸하게 돈다.
    # GitHub 의 무료 예약 실행은 보장이 아니라 여유가 있을 때 돌려주는 것이라,
    # 매시간으로 요청했더니 3시간 간격까지 벌어졌다. 요청을 촘촘히 해서
    # 실제 간격을 1시간 근처로 끌어내린다. 정각·30분 정각은 작업이 몰려
    # 밀리기 쉬우므로 7분/37분으로 비켜 놓았다.
    - cron: '7,37 * * * *'
  workflow_dispatch:        # 저장소 Actions 탭에서 손으로도 돌릴 수 있다
    inputs:
      test_notify:
        description: '알림 채널 시험 전송 (새 글이 없어도 한 통 보내본다)'
        type: boolean
        default: false
  push:
    branches: [main]

# 대시보드를 GitHub Pages 로 올리고, 확인 기록을 저장소에 되커밋하기 위해 필요하다.
permissions:
  contents: write
  pages: write
  id-token: write

# 앞선 실행이 아직 돌고 있으면 겹치지 않게 기다린다.
concurrency:
  group: notice-tap
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # 새 글이 없으면 알림이 안 나가서, 채널 설정이 맞는지 확인할 방법이 없다.
      # Run workflow 에서 이 항목을 켜면 시험 삼아 한 통 보내본다.
      - name: 알림 시험 전송
        if: ${{ inputs.test_notify }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m notice_tap test-notify

      - name: 지난 기록 불러오기
        run: python -m notice_tap import --path data/state.json

      - name: 새 글 확인
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m notice_tap check

      - name: 기록 저장하기
        run: python -m notice_tap export --path data/state.json

      - name: 대시보드를 Pages 용으로 배치
        run: |
          mkdir -p public
          cp dashboard.html public/index.html

      - name: 바뀐 기록 되커밋
        # 표현식을 쉘 명령에 직접 붙이지 않고 환경변수로 넘긴다.
        # 값에 따옴표나 세미콜론이 섞이면 명령이 조작될 수 있기 때문이다.
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # 새 글이 없으면 내보낸 내용이 한 글자도 안 바뀌므로 커밋도 생기지 않는다.
          if git diff --quiet -- data/state.json; then
            echo "새 글이 없어 커밋할 것이 없습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "공지 기록 갱신 $(date -u '+%Y-%m-%d %H:%M') UTC"
          # 그 사이 다른 커밋이 올라왔을 수 있으니 한 번 맞춰본 뒤 올린다.
          git pull --rebase --autostash origin "$BRANCH" || true
          git push origin "HEAD:$BRANCH"

      # Pages 는 저장소 Settings → Pages → Source 를 "GitHub Actions" 로
      # 한 번 바꿔두어야 한다. 워크플로 토큰으로는 사이트를 새로 만들 권한이 없다.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4

      # 여기까지 오지 못하고 앞 단계에서 죽으면 확인 자체가 안 돌아간다.
      # 그러면 실패 기록도 안 남아 '며칠째 실패' 알림도 뜨지 않는다.
      # 조용히 멈추는 상황을 막기 위해 실패했을 때 직접 알린다.
      - name: 전체 실패 알림
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "웹훅이 없어 실패를 알리지 못했습니다."
            exit 0
          fi
          python - <<'PY'
          import json, os, urllib.request

          payload = {
              "content": "⚠️ 공지 확인이 실패했습니다",
              "embeds": [{
                  "title": "실행 기록 보기",
                  "url": os.environ["RUN_URL"],
                  "description": "새 글 확인이 돌지 못했습니다. 확인이 멈춘 동안에는 공지 알림도 오지 않습니다.",
                  "color": 0xD92D20,
              }],
          }
          request = urllib.request.Request(
              os.environ["WEBHOOK"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              print("실패 알림 전송:", response.status)
          PY
