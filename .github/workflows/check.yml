name: 공지 확인

on:
  schedule:
    # 매시 17분. 정각은 전 세계 작업이 몰려 밀리기 쉬워 일부러 비켜 놓았다.
    - cron: '17 * * * *'
  workflow_dispatch:        # 저장소 Actions 탭에서 손으로도 돌릴 수 있다
  push:
    branches: [main]

# 대시보드를 GitHub Pages 로 올리고, 확인 기록을 저장소에 되커밋하기 위해 필요하다.
permissions:
  contents: write
  pages: write
  id-token: write

# 앞선 실행이 아직 돌고 있으면 겹치지 않게 기다린다.
concurrency:
  group: notice-tap
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 지난 기록 불러오기
        run: python -m notice_tap import --path data/state.json

      - name: 새 글 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python -m notice_tap check

      - name: 기록 저장하기
        run: python -m notice_tap export --path data/state.json

      - name: 대시보드를 Pages 용으로 배치
        run: |
          mkdir -p public
          cp dashboard.html public/index.html

      - name: 바뀐 기록 되커밋
        run: |
          # 새 글이 없으면 내보낸 내용이 한 글자도 안 바뀌므로 커밋도 생기지 않는다.
          if git diff --quiet -- data/state.json; then
            echo "새 글이 없어 커밋할 것이 없습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "공지 기록 갱신 $(date -u '+%Y-%m-%d %H:%M') UTC"
          # 그 사이 다른 커밋이 올라왔을 수 있으니 한 번 맞춰본 뒤 올린다.
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"

      # Pages 는 저장소 Settings → Pages → Source 를 "GitHub Actions" 로
      # 한 번 바꿔두어야 한다. 워크플로 토큰으로는 사이트를 새로 만들 권한이 없다.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
