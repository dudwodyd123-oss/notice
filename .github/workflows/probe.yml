name: 도서관 살펴보기

# 2026-11-23 부터 도서관 게시판만 403 으로 막혔다. 같은 주소를 집
# 인터넷에서 부르면 200 으로 잘 열리므로, 깃허브 서버 쪽에서만 막히는
# 것으로 보인다. 무엇이 막혔는지는 깃허브 쪽에서 직접 불러봐야 알 수
# 있어서, 이 파일을 고쳐 올릴 때 딱 한 번 돌며 결과를 남긴다.
#
# 결과는 로그가 아니라 '주석(annotation)' 으로 남긴다. 로그는 로그인해야
# 볼 수 있지만 주석은 밖에서도 읽을 수 있기 때문이다.
#
# 알아내고 나면 지울 파일이다. 남겨둬도 저절로 돌지는 않는다.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

# 저장소를 건드릴 일이 없으므로 아무 권한도 주지 않는다.
permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 도서관 주소를 여러 가지로 불러본다
        run: |
          browser='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          api='https://lib.pusan.ac.kr/pyxis-api/1/bulletin-boards/2/bulletins?nameOption=&onlyWriter=false&onlyNoticableBulletin=true&max=30'

          # $1 주소  $2 이름표(User-Agent)  $3 사람이 읽을 설명
          try() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -A "$2" "$1" || echo 000)
            echo "::warning::$3 → $code"
          }

          try "$api" "$browser" '목록 API · 브라우저 이름표'
          try "$api" 'curl/8.5.0' '목록 API · curl 이름표'
          try 'https://lib.pusan.ac.kr/guide/notice' "$browser" '공지 화면(HTML)'
          try 'https://lib.pusan.ac.kr/' "$browser" '도서관 첫 화면'
          try 'https://www.pusan.ac.kr/kor/Main.do' "$browser" '본교 홈페이지(비교용)'

      - name: 막은 쪽이 뭐라고 하는지 본다
        run: |
          browser='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          api='https://lib.pusan.ac.kr/pyxis-api/1/bulletin-boards/2/bulletins?max=1'
          # 돌아온 내용 앞부분만 한 줄로 만들어 남긴다. 줄바꿈이 들어가면
          # 주석이 거기서 잘린다.
          body=$(curl -s --max-time 20 -A "$browser" "$api" | tr -d '\r\n' | cut -c1-250)
          echo "::warning::돌아온 내용: ${body:-(빈 응답)}"
