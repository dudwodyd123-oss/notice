name: 핀 고치기

# 화면의 핀 단추가 이 저장소에 쪽지(이슈)를 미리 채워 남긴다.
# 사람이 Create 만 누르면 여기서 받아 data/pins.json 을 고친다.
# 브라우저에 깃허브 토큰을 두지 않으려는 것이 요점이다. '이 사람이 주인이
# 맞다'는 확인은 깃허브 로그인이 대신해 준다.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write   # 고친 뒤 '공지 확인' 을 손으로 부르기 위해 필요하다

# 공지 확인과 같은 순번을 쓴다. 둘이 겹치면 되커밋이 서로 엉킨다.
concurrency:
  group: notice-tap
  cancel-in-progress: false

jobs:
  pin:
    # 공개 저장소라 누구나 이슈를 열 수 있다. 주인이 남긴 핀 쪽지만 처리하고,
    # 그 밖의 이슈는 건드리지 않는다(사람이 쓴 글을 멋대로 닫지 않도록).
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.body, 'pin:')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 쪽지를 읽어 핀 목록 고치기
        # 이슈 본문을 쉘 명령에 직접 붙이지 않고 환경변수로 넘긴다.
        # 본문에 따옴표나 세미콜론이 섞이면 명령이 조작될 수 있기 때문이다.
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$BODY" > issue.txt
          python -m notice_tap pin --body issue.txt | tee result.txt
          rm -f issue.txt

      - name: 핀 목록 되커밋
        id: commit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- data/pins.json; then
            echo "바뀐 것이 없어 커밋할 것이 없습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pins.json
          git commit -m "핀 목록 갱신"
          git pull --rebase --autostash origin "$BRANCH" || true
          git push origin "HEAD:$BRANCH"
          echo "changed=yes" >> "$GITHUB_OUTPUT"

      - name: 화면 다시 그리도록 '공지 확인' 부르기
        # 여기서 push 를 해도 '공지 확인' 이 저절로 따라 돌지 않는다. 깃허브는
        # 자동 실행이 기본 토큰으로 만든 push 를 무시한다 - 작업이 서로를
        # 끝없이 부르는 것을 막기 위해서다. 손으로 부르는 것(workflow_dispatch)
        # 은 그 예외라서, 이렇게 직접 불러 줘야 화면이 다시 그려진다.
        if: steps.commit.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: gh workflow run check.yml --ref "$BRANCH"

      - name: 쪽지에 결과를 적고 닫기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --body-file result.txt
          gh issue close "$NUMBER"
