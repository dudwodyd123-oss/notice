name: 코드 검사

# 공지 확인 워크플로와 따로 둔다. 검사가 실패해도 공지 확인은 계속 돌아야 하고,
# 반대로 코드가 깨진 채 올라가면 예약 실행이 터지기 전에 여기서 먼저 알 수 있다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 문법 검사
        run: python -m compileall -q notice_tap tests

      - name: 시험 실행
        run: python -m unittest discover -s tests -v

      - name: 설정 파일이 올바른지
        run: |
          python - <<'PY'
          import yaml, pathlib, sys
          sys.path.insert(0, '.')
          from notice_tap.config import Config
          from notice_tap.parsers import PARSERS

          config = Config.load('config.yaml')
          sites = config.sites
          assert sites, "config.yaml 에 게시판이 하나도 없습니다"

          for site in sites:
              assert site.parser in PARSERS, f"{site.name}: 모르는 파서 {site.parser}"
              assert site.url.startswith("http"), f"{site.name}: 주소가 이상합니다"

          keys = [s.key for s in sites]
          assert len(keys) == len(set(keys)), "게시판 key 가 겹칩니다"
          print(f"게시판 {len(sites)}개 설정 정상")
          PY
