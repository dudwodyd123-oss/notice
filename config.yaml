# notice_tap 설정 파일
#
#  게시판은 `python -m notice_tap add <게시판 주소>` 로 추가합니다.
#
#  알림 채널의 ${...} 는 환경변수(GitHub Actions 의 Secrets)에서 값을 가져옵니다.
#  값이 없으면 그 채널은 조용히 꺼지므로, 쓰지 않는 채널은 그대로 두면 됩니다.
#  토큰을 이 파일에 직접 적지 마세요 - 이 파일은 GitHub 에 올라갑니다.
database: data/notices.db
dashboard_path: dashboard.html
notify_on_pinned: true
stale_alert_days: 2
notifiers:
  console:
    enabled: true
  discord:
    enabled: true
    webhook_url: ${DISCORD_WEBHOOK_URL}
